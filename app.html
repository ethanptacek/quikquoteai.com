<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="QuikQuoteAI workspace — quotes, leads, and clients.">
  <meta name="theme-color" content="#0d0b08">
  <meta name="robots" content="noindex">
  <title>Workspace — QuikQuoteAI</title>
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('qq-theme') || 'dark'; } catch (e) {}</script>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body class="ws-body ws">

  <header class="ws-top">
    <div style="display:flex; align-items:center; gap:12px;">
      <a class="logo" href="/">
        <svg class="logo-q" viewBox="0 0 64 64" fill="none" aria-hidden="true" focusable="false"><path d="M28.353 52.681A21 21 0 1 1 51.605 39.526" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><path d="M41.8 47.69 30.51 60.46 27.84 51.56Z" fill="currentColor"/><path d="M34.6 33.8 51.8 50" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></svg>
        <span>QuikQuoteAI</span>
      </a>
      <span class="ws-chip">Workspace</span>
    </div>
    <div class="ws-top-right">
      <button class="tgl-btn" id="theme-btn" aria-label="Toggle light or dark mode" title="Light / dark"></button>
      <div class="ws-user" id="ws-user" hidden>
        <span class="ws-avatar" id="ws-avatar">·</span>
        <span class="u-name" id="ws-name"></span>
        <span class="ws-role" id="ws-role"></span>
      </div>
      <button class="btn btn-line btn-sm" id="signout-btn" hidden>Sign out</button>
    </div>
  </header>

  <div class="ws-grid">
    <aside class="ws-side" id="ws-side" aria-label="Workspace navigation">
      <nav class="side-nav">
        <button class="side-link" data-view="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></svg>
          <span>Dashboard</span>
        </button>
        <button class="side-link" data-view="inbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2.5 2.5 0 0 1 2.5-2.5h11A2.5 2.5 0 0 1 20 7v7a2.5 2.5 0 0 1-2.5 2.5H10l-4.2 3.4a.5.5 0 0 1-.8-.4V16.5A2.5 2.5 0 0 1 4 14z"/><path d="M8.5 9.5h7M8.5 12.7h4.5"/></svg>
          <span>Inbox</span>
        </button>
        <button class="side-link" data-view="quotes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h11V20l-1.85-1.4L13.8 20l-1.8-1.4L10.2 20l-1.85-1.4L6.5 20z"/><path d="M9.5 8h5M9.5 11.5h5M12 15h2.5"/></svg>
          <span>Quotes</span>
        </button>
        <div class="side-sep" data-owner hidden></div>
        <p class="side-cap" data-owner hidden>CRM</p>
        <button class="side-link" data-view="leads" data-owner hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2.5 5 13.5h6L10.5 21.5 19 10.5h-6z"/></svg>
          <span>Leads</span>
        </button>
        <button class="side-link" data-view="clients" data-owner hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.2" r="3.2"/><path d="M3.5 19.5c.6-3.1 2.9-4.8 5.5-4.8s4.9 1.7 5.5 4.8"/><circle cx="17" cy="9.2" r="2.5"/><path d="M16.3 14.8c2.2.3 3.8 1.7 4.3 4.2"/></svg>
          <span>Clients</span>
        </button>
        <div class="side-sep"></div>
        <button class="side-link" data-view="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5h9M17.5 7.5H20M4 16.5h3M11.5 16.5H20"/><circle cx="15" cy="7.5" r="2.2"/><circle cx="9" cy="16.5" r="2.2"/></svg>
          <span>Settings</span>
        </button>
      </nav>
      <div class="side-foot">
        <p class="mono-note" style="font-size:10px;">A CONCEPT IN DEVELOPMENT<br>BUILT IN THE OPEN</p>
      </div>
    </aside>

    <main class="ws-main" id="ws-main" aria-live="polite">
      <div class="empty" style="margin-top:8vh;">
        <span class="mono-note">LOADING WORKSPACE…</span>
      </div>
    </main>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer" aria-label="Detail panel">
    <div class="drawer-head">
      <span id="drawer-title">DETAIL</span>
      <button class="x-btn" id="drawer-close" aria-label="Close panel">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
    <div class="drawer-foot" id="drawer-foot"></div>
  </aside>

  <div id="gate-root"></div>

  <script src="assets/config.js"></script>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
