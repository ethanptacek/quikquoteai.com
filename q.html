<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your estimate, prepared with QuikQuoteAI.">
  <meta name="theme-color" content="#0d0b08">
  <meta name="robots" content="noindex">
  <title>Your estimate — QuikQuoteAI</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="assets/app.css">
  <style>
    .q-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(24px, 5vw, 64px) 20px;
      position: relative;
    }
    .q-stack { display: grid; gap: 26px; justify-items: center; width: 100%; position: relative; }
    .q-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .q-brand {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--font-mono); font-size: 11.5px;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-3);
    }
    .q-brand a { color: var(--ember-hot); }
    .q-answer { font-family: var(--font-mono); font-size: 13px; color: var(--text-2); text-align: center; max-width: 46ch; }
  </style>
</head>
<body>
  <main class="q-page">
    <div class="hero-bg"></div>
    <div class="q-stack" id="q-root">
      <span class="mono-note">FETCHING YOUR ESTIMATE…</span>
    </div>
  </main>

  <script type="module">
    const root = document.getElementById('q-root');
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const usd = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
    const money = (n) => usd.format(Number(n) || 0);
    const range = (l, h) => (!l && !h ? '$—' : l === h ? money(l) : `${money(l)}–${money(h)}`);
    const pad = (n) => String(n ?? 0).padStart(4, '0');
    const token = new URLSearchParams(location.search).get('t') || '';

    const STAMPS = { sent: 'Awaiting reply', accepted: 'Accepted', declined: 'Declined', expired: 'Expired', draft: 'Draft' };

    function fail(msg) {
      root.innerHTML = `
        <div class="empty" style="max-width:420px;">
          <span class="mono-note">${esc(msg)}</span>
          <a class="btn btn-line btn-sm" href="/">Who made this? →</a>
        </div>`;
    }

    function draw(q) {
      let lo = 0, hi = 0;
      for (const it of q.items || []) {
        const qty = Number(it.qty) || 1;
        lo += qty * (Number(it.low) || 0);
        hi += qty * (Number(it.high) || 0);
      }
      const when = new Date(q.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

      root.innerHTML = `
        ${q.is_sample ? '<span class="ws-chip no-print">Sample data — not a real estimate</span>' : ''}
        <div class="receipt-lg">
          ${STAMPS[q.status] ? `<span class="stamp">${STAMPS[q.status]}</span>` : ''}
          <div class="rc-head"><span>QUIKQUOTE</span><span>EST. Nº ${esc(pad(q.est_no))}</span></div>
          <div class="rc-biz">${esc(q.business)}</div>
          ${q.customer_name ? `<div class="rc-row"><span class="k">FOR</span><span class="v">${esc(q.customer_name)}</span></div>` : ''}
          ${q.service ? `<div class="rc-row"><span class="k">SERVICE</span><span class="v">${esc(q.service)}</span></div>` : ''}
          ${q.window_label ? `<div class="rc-row"><span class="k">WINDOW</span><span class="v">${esc(q.window_label)}</span></div>` : ''}
          <div class="rc-row"><span class="k">DATE</span><span class="v">${esc(when)}</span></div>
          ${q.items?.length ? `<div class="rc-items">${q.items.map((i) =>
            `<div class="rc-row"><span class="k">${esc(i.label)}${Number(i.qty) > 1 ? ` ×${esc(i.qty)}` : ''}</span>
             <span class="v">${esc(range((Number(i.qty) || 1) * (Number(i.low) || 0), (Number(i.qty) || 1) * (Number(i.high) || 0)))}</span></div>`).join('')}</div>` : ''}
          ${q.details ? `<div class="rc-row" style="margin-top:8px;"><span class="k" style="max-width:100%; text-align:left;">${esc(q.details)}</span></div>` : ''}
          <div class="rc-total"><span>ESTIMATE</span><span class="amount">${esc(range(lo, hi))}</span></div>
          <div class="rc-note">A RANGE, NOT A PROMISE — FINAL PRICE IS CONFIRMED BEFORE ANY WORK BEGINS.</div>
        </div>

        <div class="q-actions no-print" id="q-actions"></div>
        <p class="q-answer no-print" id="q-answer"></p>
        <span class="q-brand no-print">Prepared with <a href="/">QuikQuoteAI</a> · a concept in development</span>`;

      const actions = document.getElementById('q-actions');
      if (q.status === 'sent') {
        actions.innerHTML = `
          <button class="btn btn-fill" id="q-accept">Looks good — accept ✓</button>
          <button class="btn btn-line" id="q-decline">Not this time</button>
          <button class="btn btn-line" onclick="window.print()">Print / save</button>`;
        document.getElementById('q-accept').addEventListener('click', () => respond('accept'));
        document.getElementById('q-decline').addEventListener('click', () => respond('decline'));
      } else {
        actions.innerHTML = `<button class="btn btn-line" onclick="window.print()">Print / save</button>`;
        if (q.status === 'accepted') {
          document.getElementById('q-answer').textContent =
            'This estimate has been accepted — the business will be in touch to lock in timing.';
        } else if (q.status === 'declined') {
          document.getElementById('q-answer').textContent = 'This estimate was declined.';
        }
      }
    }

    async function respond(action) {
      document.querySelectorAll('#q-actions .btn').forEach((b) => (b.disabled = true));
      try {
        const res = await fetch('/api/quote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ t: token, action }),
        });
        const j = await res.json();
        if (!res.ok) throw new Error(j.error || 'That didn’t go through.');
        draw(j);
      } catch (err) {
        document.getElementById('q-answer').textContent = err.message;
        document.querySelectorAll('#q-actions .btn').forEach((b) => (b.disabled = false));
      }
    }

    if (!token) {
      fail('THIS LINK IS MISSING ITS TOKEN.');
    } else {
      fetch(`/api/quote?t=${encodeURIComponent(token)}`)
        .then(async (r) => {
          const j = await r.json();
          if (!r.ok) throw new Error(j.error || 'Estimate not found');
          draw(j);
        })
        .catch((e) => fail(e.message.toUpperCase()));
    }
  </script>
</body>
</html>
